name: Bootstrap Scripture Study

on:
  push:
    paths:
      - '.bundle/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check bundle readiness
        id: ready
        shell: bash
        run: |
          if [ -f .bundle/archive.zip ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack V3.2
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          unzip -t .bundle/archive.zip
          unzip -o .bundle/archive.zip -d .
          rm -rf .bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Scripture Study Ultimate V3.2"
          git push
