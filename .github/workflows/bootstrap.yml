name: Bootstrap Scripture Study

on:
  push:
    paths:
      - '.bundle/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified V3.2 bundle
        shell: bash
        run: |
          test -f .bundle/READY
          cat \
            .bundle/part-001 \
            .bundle/part-002 \
            .bundle/part-003 \
            .bundle/fix4-0 .bundle/fix4-1 .bundle/fix4-2 \
            .bundle/fix5-0 .bundle/fix5-1a .bundle/fix5-1b .bundle/fix5-1c .bundle/fix5-2 \
            .bundle/part-006 \
            .bundle/part-007 \
            .bundle/part-008 \
            | base64 --decode > .bundle/archive.zip
          unzip -t .bundle/archive.zip

      - name: Unpack V3.2
        shell: bash
        run: |
          unzip -o .bundle/archive.zip -d .
          rm -rf .bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Scripture Study Ultimate V3.2"
          git push
